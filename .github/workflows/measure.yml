# Measures every half hour, keeps the history on the `data` branch, publishes the windowed
# figures to the testnet oracle, and deploys the dashboard and static API to GitHub Pages.
#
# Read-only against mainnet (Horizon GETs and Soroban simulations). The only write is to the
# Stellar *testnet* oracle, signed with a testnet-only key held as a repository secret
# (ORBIT_TESTNET_PUBLISHER_SECRET). No mainnet key ever reaches CI.

name: measure

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: measure
  cancel-in-progress: false

env:
  ORACLE: CCOI2QVXHQIX7ZADUT5LSJPDAQSKPEINUK6HCMCSCZTWLB5BK7W4CBUQ
  STELLAR_CLI_VERSION: 30.0.1
  PUBLISHER: GCVJPQMM4FRSAB6E6FWAC6BVDDFL6WXQH5WE6AP5674L5EMASNIQ4AZ4

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_PUBLISHER_KEY: ${{ secrets.ORBIT_TESTNET_PUBLISHER_SECRET != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Random delay so sample times cannot be predicted (scheduled runs only).
      - name: Jitter
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 420 ))

      - name: Check out history
        run: |
          git config user.name "orbit-measure"
          git config user.email "orbit-measure@users.noreply.github.com"
          if git fetch --depth=1 origin data; then
            git worktree add history FETCH_HEAD
            git -C history switch -c data
          else
            git worktree add --orphan -b data history
          fi
          mkdir -p history/snapshots

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p orbit-api -p orbit-publisher

      - name: Measure and export
        id: measure
        continue-on-error: true
        run: |
          ./target/release/orbit-api --once --registry assets.toml \
            --data-dir history/snapshots --export-dir site

      - name: Save history
        run: |
          cd history
          git add snapshots
          if ! git diff --cached --quiet; then
            git -c user.name=orbit-measure -c user.email=orbit-measure@users.noreply.github.com \
              commit -q -m "Measurement $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin data
          fi

      - name: Publish to the testnet oracle
        env:
          SECRET: ${{ secrets.ORBIT_TESTNET_PUBLISHER_SECRET }}
        if: env.HAS_PUBLISHER_KEY == 'true'
        continue-on-error: true
        run: |
          curl -sSfL -o /tmp/stellar.tgz \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$HOME/.local/bin" && tar -xzf /tmp/stellar.tgz -C "$HOME/.local/bin" stellar
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p "$HOME/.config/stellar/identity"
          umask 077
          printf 'secret_key = "%s"\n' "$SECRET" > "$HOME/.config/stellar/identity/orbit-testnet-publisher.toml"
          # The secret must be the key the oracle accepts as publisher.
          got="$(stellar keys address orbit-testnet-publisher)"
          if [ "$got" != "$PUBLISHER" ]; then
            echo "publisher secret is for $got, expected $PUBLISHER"
            rm -f "$HOME/.config/stellar/identity/orbit-testnet-publisher.toml"
            exit 1
          fi
          ./target/release/orbit-publish --network testnet --oracle "$ORACLE" \
            --source orbit-testnet-publisher --registry assets.toml --data-dir history/snapshots
          rm -f "$HOME/.config/stellar/identity/orbit-testnet-publisher.toml"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build dashboard
        working-directory: web
        env:
          ORBIT_STATIC_DIR: ${{ github.workspace }}/site
          NEXT_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          npm ci
          npm run build
          cp -R out/. ../site/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5

      - name: Fail if the measurement failed
        if: steps.measure.outcome == 'failure'
        run: exit 1
