# Soroban AMM pools (constant-product only). Each address is checked on-chain before use:
# its tokens must equal the locally derived SAC addresses of the asset and the counter, and
# Aquarius pools must report pool_type "constant_product". Found from Aquarius's pool list
# and the Soroswap factory's get_pair; a pool left out here only understates depth.
# Pools with kind = "quoted" (Aquarius concentrated or stable) are measured from the
# pool's own estimate_swap quotes; their type must be concentrated or stable.
# Not yet measured: pools against counters other than USDC and XLM (sUSD, XLD, AQUA, KPOP),
# which includes the only stable pool for these assets (USTRY/XLD).

