[package]
name = "pocky-ingest"
description = "Read-only clients for Horizon, Soroban RPC and SEP-1 stellar.toml files"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pocky-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = "0.8"
sha2 = "0.10"
stellar-strkey = "1.0.0"
stellar-xdr = { version = "28", default-features = false, features = ["std", "base64"] }
ureq = { version = "2.10", features = ["json"] }
