[package]
name = "pocky-publisher"
description = "Publish windowed exit-liquidity figures to the Pocky depth oracle"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "pocky-publish"
path = "src/main.rs"

[dependencies]
pocky-api = { workspace = true }
pocky-core = { workspace = true }
pocky-ingest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
stellar-xdr = { version = "28", default-features = false, features = ["std", "base64"] }
