[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["contracts"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.87"

[workspace.dependencies]
orbit-core = { path = "crates/orbit-core" }
orbit-ingest = { path = "crates/orbit-ingest" }
orbit-api = { path = "crates/orbit-api" }
orbit-publisher = { path = "crates/orbit-publisher" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[profile.release]
overflow-checks = true
