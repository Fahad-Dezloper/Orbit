[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["contracts"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.82"

[workspace.dependencies]
pocky-core = { path = "crates/pocky-core" }
pocky-ingest = { path = "crates/pocky-ingest" }
pocky-api = { path = "crates/pocky-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[profile.release]
overflow-checks = true
